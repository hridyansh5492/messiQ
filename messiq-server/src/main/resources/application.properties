# =======================================================
# messiQ Backend Server Configuration
# =======================================================
server.port=${PORT:8080}

spring.application.name=messiq-server

# Default Database: Embedded H2 with MySQL mode (overridable via Supabase/Postgres/MySQL env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/messiq_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# spring.jpa.database-platform will be auto-detected by Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console for DB inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
messiq.upload.dir=./uploads

# Logging
logging.level.com.messiq=INFO
logging.level.org.springframework.web.socket=INFO
