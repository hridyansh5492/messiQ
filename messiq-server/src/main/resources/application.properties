# =======================================================
# messiQ Backend Server Configuration
# =======================================================
server.port=8080

spring.application.name=messiq-server

# Default Development Database: H2 with MySQL mode (works out of the box)
spring.datasource.url=jdbc:h2:file:./data/messiq_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# spring.jpa.database-platform will be auto-detected by Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console for DB inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
messiq.upload.dir=./uploads

# Logging
logging.level.com.messiq=INFO
logging.level.org.springframework.web.socket=INFO
