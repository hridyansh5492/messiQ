# =======================================================
# messiQ Backend Server - MySQL Profile Configuration
# Activate with: --spring.profiles.active=mysql
# =======================================================
spring.datasource.url=jdbc:mysql://localhost:3306/messiq_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=messiq_user
spring.datasource.password=messiq_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
