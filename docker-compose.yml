version: '3.8'

services:
  messiq-mysql:
    image: mysql:8.0
    container_name: messiq-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: messiq_db
      MYSQL_USER: messiq_user
      MYSQL_PASSWORD: messiq_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.mysql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - messiq-network

networks:
  messiq-network:
    driver: bridge

volumes:
  mysql_data:
